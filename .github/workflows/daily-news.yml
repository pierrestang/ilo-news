name: Daily Bordeaux immo news

on:
  schedule:
    # Tous les jours à 6h00 UTC (~8h en France l'été, 7h l'hiver)
    - cron: "0 6 * * *"
  workflow_dispatch: # permet aussi de le lancer manuellement depuis GitHub

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install rss-parser

      - name: Fetch and summarize news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node fetch-news.js

      - name: Commit updated JSON
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add bordeaux-immo-news.json
          git diff --cached --quiet || git commit -m "Mise à jour actualités immobilières du jour"
          git push
